name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: sherlock-linux-amd64
            archive: sherlock-linux-amd64.tar.gz
          - goos: darwin
            goarch: amd64
            output: sherlock-darwin-amd64
            archive: sherlock-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            output: sherlock-darwin-arm64
            archive: sherlock-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            output: sherlock-windows-amd64.exe
            archive: sherlock-windows-amd64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: Build ${{ matrix.output }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o ${{ matrix.output }} ./cmd/sherlock
      - name: Pack
        run: |
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -9 ${{ matrix.archive }} ${{ matrix.output }}
          else
            tar -czf ${{ matrix.archive }} ${{ matrix.output }}
          fi
          ls -lh ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
